interaction_data_path: "data/full_data.csv"
item_data_path: "data/item_specification.csv"

user_id: "StudentID"
item_id: "QuestionID"
target: "Result"

item_features:
  - name: "Level"
    type: "categorical"
  - name: "Topic"
    type: "categorical"

splitter:
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1

smoothing: 5

xgb_config:
  model_name: xgb

  threshold: 0.5
  feature_columns: null

  model_params:
    objective: binary:logistic
    eval_metric: logloss
    tree_method: hist
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    min_child_weight: 5.0
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    random_state: 12
    n_jobs: -1

  tuning:
    enabled: true
    n_trials: 2
    study_name: xgb_hyperparameter_tuning
    direction: maximize
    metric: f1
    seed: 12
    search_space:
      learning_rate:
        type: float
        distribution: loguniform
        low: 1.0e-5
        high: 1.0e-2
      max_depth:
        type: int
        distribution: uniform
        low: 2
        high: 10
      min_child_weight:
        type: float
        distribution: uniform
        low: 1.0
        high: 10.0
      subsample:
        type: float
        distribution: uniform
        low: 0.6
        high: 1.0

  output:
    score_col: pred_proba
    prediction_col: prediction
    rank_col: rank

ncf_config:
  model_name: ncf

  threshold: 0.5

  feature_columns:
    - student_n_correct
    - student_accuracy
    - item_n_correct
    - item_n_attempts
    - item_accuracy

  model_params:
    embedding_dim: 16
    hidden_dims: [64, 32]
    dropout: 0.10
    learning_rate: 0.001
    weight_decay: 0.00001
    batch_size: 512
    epochs: 50
    early_stopping_patience: 7
    log_every_n_epochs: 5
    random_state: 12
    device: auto

  tuning:
    enabled: true
    n_trials: 2
    study_name: ncf_hyperparameter_tuning
    direction: maximize
    metric: f1
    seed: 12
    search_space:
      embedding_dim:
        type: int
        distribution: uniform
        low: 8
        high: 64
      dropout:
        type: float
        distribution: uniform
        low: 0.0
        high: 0.5
      learning_rate:
        type: float
        distribution: loguniform
        low: 1.0e-4
        high: 1.0e-2
      batch_size:
        type: categorical
        choices:
          - 128
          - 256
          - 512
      hidden_dims:
        type: categorical
        choices:
          - [32, 16]
          - [64, 32]
          - [128, 64]
          - [256, 128, 64]

  output:
    score_col: pred_proba
    prediction_col: prediction
    rank_col: rank

knowledge_tracing_config:
  model_name: knowledge_tracing
  threshold: 0.5

  model_params:
    alpha: 1.0
    beta: 1.0
    w0: 0.0
    w1: 3.0
    w2: 2.0
    category_columns:
      - a_category
      - b_category
      - c_category
      - d_category
      - e_category
    category_aggregation: mean
    item_accuracy_col: item_accuracy
    clip_probability: true

  tuning:
    enabled: true
    n_trials: 40
    study_name: kt_hyperparameter_tuning
    direction: minimize
    metric: log_loss
    seed: 12
    search_space:
      alpha:
        type: float
        distribution: loguniform
        low: 0.1
        high: 5.0
      beta:
        type: float
        distribution: loguniform
        low: 0.1
        high: 5.0
      w0:
        type: float
        distribution: uniform
        low: -2.0
        high: 2.0
      w1:
        type: float
        distribution: uniform
        low: 0.5
        high: 6.0
      w2:
        type: float
        distribution: uniform
        low: 0.0
        high: 6.0

  output:
    score_col: pred_proba
    prediction_col: prediction
    rank_col: rank


zpd_config:
  model_name: zpd
  probability_col: pred_proba
  base_score_col: null

  model_params:
    score_mode: probability
    lower_probability: 0.55
    target_probability: 0.65
    upper_probability: 0.75
    min_in_zone_score: 0.7
    outside_tolerance: 0.25
    clip_probability: true
    base_score_weight: 0.4
    zpd_score_weight: 0.6

  output:
    zpd_value_col: zpd_value
    zpd_distance_col: zpd_distance
    zpd_score_col: zpd_score
    zpd_label_col: zpd_label
    is_aligned_col: is_zpd_aligned
    adjusted_score_col: zpd_adjusted_score
    rank_col: zpd_rank

flow_config:
  model_name: flow_theory
  probability_col: pred_proba
  base_score_col: null

  model_params:
    lower_probability: 0.45
    target_probability: 0.60
    upper_probability: 0.75
    min_in_flow_score: 0.7
    outside_tolerance: 0.25
    clip_probability: true
    base_score_weight: 0.5
    flow_score_weight: 0.5

  output:
    flow_value_col: flow_value
    flow_distance_col: flow_distance
    flow_score_col: flow_score
    flow_label_col: flow_label
    is_aligned_col: is_flow_aligned
    adjusted_score_col: flow_adjusted_score
    rank_col: flow_rank

flow_theory_config:
  model_name: flow_theory
  probability_col: pred_proba
  base_score_col: null

  model_params:
    lower_probability: 0.45
    target_probability: 0.60
    upper_probability: 0.75
    min_in_flow_score: 0.7
    outside_tolerance: 0.25
    clip_probability: true
    base_score_weight: 0.5
    flow_score_weight: 0.5

  output:
    flow_value_col: flow_value
    flow_distance_col: flow_distance
    flow_score_col: flow_score
    flow_label_col: flow_label
    is_aligned_col: is_flow_aligned
    adjusted_score_col: flow_adjusted_score
    rank_col: flow_rank
