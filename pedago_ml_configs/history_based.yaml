interaction_data_path: "data/full_data.csv"
item_data_path: "data/item_specification.csv"

user_id: "StudentID"
item_id: "QuestionID"
target: "Result"

item_features:
  - name: "Level"
    type: "categorical"
  - name: "Topic"
    type: "categorical"

splitter:
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1

smoothing: 5

xgb_config:
  model_name: xgb

  threshold: 0.5
  feature_columns: null

  model_params:
    objective: binary:logistic
    eval_metric: logloss
    tree_method: hist
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    min_child_weight: 5.0
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    random_state: 12
    n_jobs: -1

  output:
    score_col: pred_proba
    prediction_col: prediction
    rank_col: rank

ncf_config:
  model_name: ncf

  threshold: 0.5

  feature_columns:
    - student_n_correct
    - student_accuracy
    - item_n_correct
    - item_n_attempts
    - item_accuracy

  model_params:
    embedding_dim: 16
    hidden_dims: [64, 32]
    dropout: 0.10
    learning_rate: 0.001
    weight_decay: 0.00001
    batch_size: 512
    epochs: 50
    early_stopping_patience: 7
    log_every_n_epochs: 5
    random_state: 12
    device: auto

  output:
    score_col: pred_proba
    prediction_col: prediction
    rank_col: rank

zpd_config:
  model_name: zpd
  probability_col: pred_proba
  base_score_col: null

  model_params:
    score_mode: probability
    lower_probability: 0.55
    target_probability: 0.65
    upper_probability: 0.75
    min_in_zone_score: 0.7
    outside_tolerance: 0.25
    clip_probability: true
    base_score_weight: 0.4
    zpd_score_weight: 0.6

  output:
    zpd_value_col: zpd_value
    zpd_distance_col: zpd_distance
    zpd_score_col: zpd_score
    zpd_label_col: zpd_label
    is_aligned_col: is_zpd_aligned
    adjusted_score_col: zpd_adjusted_score
    rank_col: zpd_rank

flow_config:
  model_name: flow_theory
  probability_col: pred_proba
  base_score_col: null

  model_params:
    lower_probability: 0.45
    target_probability: 0.60
    upper_probability: 0.75
    min_in_flow_score: 0.7
    outside_tolerance: 0.25
    clip_probability: true
    base_score_weight: 0.5
    flow_score_weight: 0.5

  output:
    flow_value_col: flow_value
    flow_distance_col: flow_distance
    flow_score_col: flow_score
    flow_label_col: flow_label
    is_aligned_col: is_flow_aligned
    adjusted_score_col: flow_adjusted_score
    rank_col: flow_rank

flow_theory_config:
  model_name: flow_theory
  probability_col: pred_proba
  base_score_col: null

  model_params:
    lower_probability: 0.45
    target_probability: 0.60
    upper_probability: 0.75
    min_in_flow_score: 0.7
    outside_tolerance: 0.25
    clip_probability: true
    base_score_weight: 0.5
    flow_score_weight: 0.5

  output:
    flow_value_col: flow_value
    flow_distance_col: flow_distance
    flow_score_col: flow_score
    flow_label_col: flow_label
    is_aligned_col: is_flow_aligned
    adjusted_score_col: flow_adjusted_score
    rank_col: flow_rank
