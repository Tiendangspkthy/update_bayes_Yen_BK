model_name: ncf

user_id: StudentID
item_id: QuestionID
target_col: Result

threshold: 0.5

feature_columns:
  - student_n_correct
  - student_accuracy
  - item_n_correct
  - item_n_attempts
  - item_accuracy

model_params:
  embedding_dim: 16
  hidden_dims: [64, 32]
  dropout: 0.10
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 512
  epochs: 50
  early_stopping_patience: 7
  log_every_n_epochs: 5
  random_state: 12
  device: auto

output:
  score_col: ncf_pred_proba
  prediction_col: ncf_pred
  rank_col: ncf_rank
