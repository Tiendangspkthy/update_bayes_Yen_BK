model_name: xgb

user_id: StudentID
item_id: QuestionID
target_col: Result

threshold: 0.5
feature_columns: null

model_params:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 3
  min_child_weight: 5.0
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  random_state: 12
  n_jobs: -1

output:
  score_col: xgb_pred_proba
  prediction_col: xgb_pred
  rank_col: xgb_rank
